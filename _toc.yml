# Jupyter Book Table of Contents — workshop structure.
# This is the source of truth for the sidebar navigation. Files not listed
# here are ignored even if they live in the source tree.

format: jb-book
root: intro

parts:
  - caption: Workshop overview
    chapters:
      - file: schedule
      - file: prerequisites
      - file: resources
      - file: handout
      - file: acknowledgments

  - caption: Ramp-up evening (optional)
    chapters:
      - file: ramp-up/rampup_evening
      - file: ramp-up/notebooks/python_basics
      - file: ramp-up/notebooks/image_basics

  - caption: Lectures
    chapters:
      - file: lectures/01_intro_ai_imaging/lecture
        title: "Lecture 1: AI for Scientific Image Analysis"
        sections:
          - file: lectures/01_intro_ai_imaging/00_lecture_prereqs_check
            title: "Overview & Setup"
          - file: lectures/01_intro_ai_imaging/extras
            sections:
              - file: lectures/01_intro_ai_imaging/speaker_cues
              - file: lectures/01_intro_ai_imaging/verification_log
      - file: lectures/02_walking_the_day/lecture
        title: "Lecture 2: Walking the Day"

  - caption: Lab notebooks (core)
    chapters:
      - file: notebooks/00_data_sources
      - file: notebooks/00_setup_self_check
      - file: notebooks/01_cellpose_segmentation
      - file: notebooks/02_validation_quantification
      - file: notebooks/03a_denoising_n2v
      - file: notebooks/03b_foundation_model_segmentation
      - file: notebooks/04_community_platforms
      - file: notebooks/05_desktop_gui_complements

  - caption: Extension notebooks (post-workshop, self-paced)
    chapters:
      - file: notebooks/06_virtual_staining
      - file: notebooks/07_widefield_superres
      - file: notebooks/08_srrf_esrrf
      - file: notebooks/09_cellpose_finetune
      - file: notebooks/10_3d_segmentation
      - file: notebooks/11_dl_tracking
      - file: notebooks/12_deconvolution
      - file: notebooks/13_validation_case_study
      - file: notebooks/14_spot_detection
      - file: notebooks/15_diffusion_models
      - file: notebooks/16_wsi_transcriptomics

  - caption: Setup and data
    chapters:
      - file: env/README
